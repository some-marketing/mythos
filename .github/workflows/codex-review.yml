name: codex-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: openai/codex@v1
        with:
          model: gpt-5.5-codex
          prompt: |
            You are reviewing this pull request in the Mythos repo as a distinct
            intelligence family (producer-never-validates-own-trial: you are the
            independent reviewer; the PR author is a different mind).

            Review the diff of this PR. Focus on:
            1. Harness-parity registration correctness: tools/signals/lib/*
               (bridge-target-policy.js, actor-registry.js, target-command-policy.cjs,
               dispatch-bridge.js), instructions/adapters/*.yaml,
               instructions/canonical/dispatch-routing-rule.yaml,
               _dev/config/harness-protocol-propagation.json.
            2. World mind safety: tools/ant-hive-world/world-mind.js +
               world-mind-harness.cjs — no-godmode (never overrides a hive),
               LLM harness isolation, host-initiated guest transport only.
            3. Parity guard robustness: tools/hygiene/mythos-parity-check.cjs
               (exit codes, drift receipts, runtime path resolution).
            4. parity/baseline.json + wiring-graph.json registration consistency.

            Report findings by severity: CRITICAL / MAJOR / MINOR / OK, with
            file:line citations. Be adversarial and specific. CRITICAL/MAJOR
            findings block merge.
