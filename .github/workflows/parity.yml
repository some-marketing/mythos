name: portable-parity

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:parity
      - run: node --test tools/parity/__tests__/verify-parity.test.cjs tools/parity/__tests__/reconciliation-ledger.test.cjs
      - run: node tools/kernel/hooks/__tests__/pretool-orchestrator-worker-gate.test.cjs
      - run: node tools/signals/lib/__tests__/review-task-plan-narrative.test.cjs
