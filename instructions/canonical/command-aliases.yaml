version: "MythosAliasRegistry/1.0"
# Multi-domain alias registry. Four sibling domains, each a map of
# alias-key -> { resolves_to (a terminal canonical id, single-hop), status }.
# Domain -> resolver token: aliases=commands, framework_aliases=frameworks,
# skill_aliases=skills, tool_aliases=tools. Names are lowercase-kebab; lookup is
# case-insensitive. resolves_to must be a terminal id in that domain's catalog
# (commands -> .claude/commands files; frameworks -> system.yaml ids; skills ->
# shipped skills; tools -> package.json scripts). Alias -> alias is forbidden.
aliases:
  # --- Primary mythic names ---
  guild-ledger:
    resolves_to: system-status
    status: primary
  guildmaster-loop:
    resolves_to: orchestrate-loop
    status: primary
