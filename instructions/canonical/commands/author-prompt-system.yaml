{
  "id": "author-prompt-system",
  "description": "Author or update prompt packs and the master run order from _dev research and proposed flows",
  "mode": "PATCH_ALLOWED",
  "objective": "Turn prompt-system intent that exists only as _dev research, audits, planning docs, or proposed workflow notes into concrete prompt-system assets under _dev/prompts/ so later commands can reconcile and execute them deterministically.",
  "scope_resolution": {
    "default": "Inspect the full prompt-system input surface under _dev/",
    "arguments": {
      "all": "Inspect the full prompt-system input surface under _dev/",
      "master": "Rewrite or update the current top-level master workflow surfaces from latest repo truth, centered on _dev/prompts/claude-master-run-order.md",
      "<path>": "Use the specified research, audit, or flow path plus directly related planning docs as the authoring source set"
    }
  },
  "process": [
    "Resolve scope from arguments: if empty or 'all', inspect full _dev/ prompt-system input surface; if 'master', focus on rewriting the current master workflow from latest repo truth rather than preserving stale historical wording; if a path, use that target plus related planning docs.",
    "Read the relevant _dev inputs: prompt-system sources in _dev/prompts/, analysis and audit material in _dev/reports/analysis/ and _dev/reports/audit/, planning docs such as whats-next.md and related _dev architecture or consideration notes, and proposed flow docs or design notes.",
    "Classify what needs to be authored or updated: reusable prompt packs (claude-prompt-pack-*.md), run prompts (claude-run-*.md), master sequencing doc (claude-master-run-order.md), and prompt manifest registration entries in _dev/prompts/manifest.json.",
    "Author the missing or stale prompt-system assets directly: derive reusable prompt packs from research/proposed flow inputs, author or update the master run order, keep one-shot run prompts separate from reusable prompt packs, preserve observational evidence-first language when source material includes open questions.",
    "When scope is 'master', treat the current repo state as authoritative over older master wording: replace stale primary-workflow declarations, rewrite obsolete top-level sequencing, and demote older flows to supporting, bounded, standalone, or historical status instead of preserving them as active by inertia.",
    "When the current repo state supports one canonical top-level workflow, make that explicit in the master run order and demote other reusable prompt packs to supporting, bounded, or historical status rather than leaving multiple competing 'primary' workflows.",
    "Capture prompt-authoring gaps by writing: authoring report to _dev/reports/analysis/prompt-system-authoring.md and expectation-failure capture to _dev/reports/analysis/prompt-system-authoring.expectation-failures.json with scope, authored_at, source_inputs, and failures array.",
    "Run follow-up reconciliation: ensure _dev/prompts/manifest.json registers each reusable prompt pack, ensure master-run-order references point only to real prompt-system files, run npm run manifest:sync and npm run instructions:validate if command or canonical surfaces changed, recommend assemble-prompt-system if separate cleanup is needed."
  ],
  "authoring_rules": [
    "Prompt packs must be authored from cited repo inputs, not invented without a source trail.",
    "Keep reusable prompt packs distinct from one-shot run prompts.",
    "The master run order is the sequencing source of truth, not a duplicate of prompt-pack body content.",
    "For scope 'master', newer repo truth wins: do not preserve stale top-level workflow declarations just because they were already in the master surfaces.",
    "Planning-focused prompt packs should define repo-truth inventory, explicit read-only subagent boundaries, and a verification matrix or equivalent compliance surface before implementation handoff.",
    "Do not leave multiple prompt packs implicitly acting as the current main workflow when the intended authoring model has only one canonical top-level path.",
    "When source material conflicts, preserve the conflict in the authoring report instead of silently collapsing it.",
    "Do not treat vague ideas as completed prompt-system assets; either author them concretely or record the missing detail in the expectation-failure JSON.",
    "Every prompt pack that defines a multi-step workflow should require independent verification after each build step.",
    "Every prompt pack should state its execution posture explicitly: optimization notes, multi-agent functionality, and model guidance.",
    "Before authoring a prompt pack from a source doc, consider whether the source has been reviewed for promotion readiness. See _dev/policies/source-material-qa.md for the source-status ladder and minimum source-document contract. Source readiness is a consideration, not a hard gate."
  ],
  "success_criteria": [
    "New or updated prompt-system assets are authored from explicit _dev source material",
    "_dev/prompts/claude-master-run-order.md reflects the current authored stage flow when in scope",
    "Reusable prompt packs and run prompts remain correctly separated",
    "Prompt-authoring expectation-failure capture written even when empty",
    "Follow-up reconciliation guidance provided"
  ],
  "operator_guidance_phase_1": true,
  "operator_guidance_contract": {
    "rule": "This command must end with conditional next-step options (each with condition, command, why), plus a concrete request for operator input that would improve or harden the system."
  },
  "handoff": {
    "successful_authoring": "assemble-prompt-system all",
    "source_too_contradictory": "review-progress <source-path>",
    "not_yet_reconciled": "assemble-prompt-system all"
  },
  "artifacts": [
    "_dev/reports/analysis/prompt-system-authoring.md",
    "_dev/reports/analysis/prompt-system-authoring.expectation-failures.json"
  ]
}
