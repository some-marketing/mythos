  "process": [
    "Step 0 — watcher-start: Start the coordination-family watchers (watch-codex-bridge, watch-actor-bridge, watch-pipeline-loop) via node tools/sessions/watcher-lifecycle.cjs start <session-id> --root <project-root> (the '0' mechanical command registered in new-session.cjs defaultCommands()). Each managed default watcher performs its local setup and one discovery/snapshot, sends PREPARED over the managed IPC channel, and waits without provider, actor, or other external dispatch. The lifecycle holds the owned child handles, requires matching PREPARED messages, publishes the complete generation atomically to the durable session registry while holding the session lock, sends COMMIT, requires a bounded fresh local authority scan, then requires matching COMMITTED messages, and permits the first normal-loop effect or dispatch only from that acknowledged scan result. The bounded PREPARED-to-COMMIT acknowledgement is custody evidence only and does not claim freshness or health. The lifecycle records each committed process identity (pid + start time + executable + argv fingerprint) in the session registry; the step is idempotent and duplicate-safe: before spawning, it runs a pre-emptive cleanup pass for existing identity-verified entries. If any watcher fails, the already-started set is rolled back and the step fails closed. A child that cannot be reaped is reported as owned blocked repair with its session/name/PID/start-time evidence and the existing safe stop pickup path; it is never silently erased or retried blindly. Custom commands must declare readiness: 'ipc-required' or readiness: 'liveness-only'; unknown or missing readiness fails closed, and liveness-only is visibly degraded. Process-identity enforcement is POSIX-only (macOS/Linux): stop/cleanup verifies pid + start time + command fingerprint before signaling and refuses mismatches. On Windows the module performs an existence check only — that is NOT identity verification. An unresolvable session id is a clean no-op (exit 0, reported) because an unrecorded daemon could never be identity-verified later. Runs FIRST so the coordination family reaches the bounded managed startup boundary before the session continues; it does not claim that watchers are healthy for the whole session.",
    "Step 1 — auto-commit (from /boot): Run node tools/hygiene/auto-commit.js --auto --foreground via Bash. Exit 0 = success (clean, all committed, OR skipped due to branch gate). Exit 2 = partial (ungrouped files skipped). Both acceptable, continue. Exit 1 = failure — stop and report. In addition, run node tools/hygiene/disk-quota-guard.cjs --check to verify host available disk space remains above 15 GB, failing-safe to warning-only mode.",
    "Step 2 — dirty-tree gate: Run git status --short | wc -l and capture the count. If count == 0: skip to step 4. If count > 0 (auto-commit was skipped due to branch gate, or left ungrouped files behind): proceed to step 3.",
    "Step 3 — /clean-house (only if dirty): Invoke /clean-house per its canonical process, which includes mandatory custody scoping before any commit proposal. The dirty-tree inventory must be scoped to this session's own custody (write-ledger _dev/state/active-sessions/<session_id>/write_log.json ∪ the active plan's scope_identity.owned_artifacts). Files outside that custody set are surfaced as out_of_custody_dirty and MUST NOT be proposed for commit — per orchestrate-loop invariant 'global dirty worktree state is context, not ownership'. The git-custody gate (tools/hooks/pretool-git-custody-gate.cjs) is the mechanical backstop. Full process: inventory → custody-scoped grouping → propose commit plan (own files only, foreign files listed as context) → operator approval → execute scoped commits. Do NOT bypass the approval gate. On deferral: capture deferred files and surface them in the kernel read (step 5) under BLOCKED.",
    "Step 3b — resume-boundary context load (only when the operator chooses a pending boundary scope): Run node tools/sessions/consume-boundary.cjs <scope>. Treat the emitted <RESUMED_SESSION_HANDOFF ...> packet as the Current State seed for that resumed scope. The consumer loads only the selected scope's handoff content with bounded full/excerpt behavior; it does not consume or inject other pending scopes. If the packet reports HANDOFF_MISSING or HANDOFF_STALE, surface that warning before following the recommended next command.",
    "Step 4 — system status + active work (from /boot): Run npm run status via Bash and surface next recommended command, system health, maintenance conditions, live signals, and planning staleness. Invoke the /whats-next process exactly as defined in that command. Do not reimplement. The composed /boot step owns repo-awareness and plan-visibility cache invalidation (see boot.yaml step 1b). Cache refresh (boot.yaml 1b, mechanical): the deterministic runner first runs `npm run context:repo-awareness` to rebuild the repo-awareness surface, then `npm run plans:dashboard` ONLY when repo-awareness reports stale plan visibility. Dead-session reaper (mechanical, advisory): the runner also runs a report-only scan (tools/sessions/boot-dead-session-reaper.cjs) that surfaces pending boundary scopes which are crash-stub orphans or whose referenced plan already shows completion evidence (plan-task-review-state at an approved/stamped/complete grade), each with resume-or-tombstone options and evidence links. It NEVER auto-consumes or tombstones — tombstoning is an operator action with a receipt.",
