{
  "id": "review-progress",
  "description": "Run a findings-first review of progress or pipeline output",
  "mode": "REVIEW_ONLY",
  "objective": "Independently assess current progress or output quality, produce a findings-first review, and capture unmet output expectations in _dev/reports/analysis/.",
  "scope_resolution": {
    "default": "Review overall repo progress",
    "arguments": {
      "pipeline": "Review historical main-pipeline progress and its current replacement state without reopening execution",
      "advance-pipeline": "Review the latest legacy master-plan execution evidence and supporting prompt-system state",
      "active-workstreams": "Review the current bounded queues, assignment clarity, signal truth, and next-step coherence across active side workstreams",
      "<path>": "Review the specified file or directory target and directly related source-of-truth docs",
      "<scope-name>": "Review a specific scoped workstream by its signal_scope identifier (e.g. signal-purity-and-canonicalization)"
    }
  },
  "process": [
    "Resolve scope from arguments: if empty, review overall repo progress; if 'pipeline', review historical main-pipeline progress and its current replacement state; if 'advance-pipeline', review latest legacy master-plan execution evidence; if 'active-workstreams', review the current bounded queues; if a path, review that target.",
    "Read the governing sources for the chosen scope: for prompt-system or pipeline reviews, read tools/codex/prompt-system/claude-master-run-order.md; for active-workstreams, read _dev/reports/analysis/plan-active-workstreams.md, _dev/reports/analysis/plan-active-workstreams.next-step.json, and the live coordination signals for each queued signal_scope; read any prompt packs, command docs, or lifecycle artifacts referenced by the target; read relevant evidence from _dev/reports/analysis/, _dev/reports/lifecycle/, and _dev/reports/signals/ when present.",
    "For long-running multi-actor loops or repeated command work, also inspect the latest same-day session-learnings__*.md artifact and the most recent review artifact for the same scope to catch recurring drift rather than treating each pass as isolated.",
    "Derive the output expectations from the source-of-truth docs. Do not trust self-reported completion claims without evidence.",
    "Compare expected versus observed state and identify: blocker-level misses, warning-level drift or partial completion, and truthful completions with sufficient evidence.",
    "Write a markdown review to _dev/reports/analysis/review-progress__<scope-safe>.md.",
    "Write an expectation-failure capture to _dev/reports/analysis/review-progress__<scope-safe>.expectation-failures.json with scope, reviewed_at, source_of_truth, and failures array (id, severity, expected, observed, evidence, recommended_next_action). Write with empty failures array if no failures.",
    "Report findings to the user in order: findings by severity, open questions or assumptions, short progress summary."
  ],
  "review_rules": [
    "Reviews are evidence-first and findings-first.",
    "Prioritize bugs, missing checks, behavioural drift, stale planning, and false completion claims.",
    "If no findings are discovered, state that explicitly and mention residual risk or validation gaps.",
    "Do not widen scope into implementation unless the user explicitly asks for fixes.",
    "Check for skipped verification: if multi-step work was done by subagents, confirm independent verification ran at each step.",
    "Check ordering violations: governance stages must precede optimization stages, control plane before recovery logic, stabilization before abstraction.",
    "In extended sessions, run a lessons-reconciliation review every 3-5 substantive turns or after any blocked -> fix -> close cycle. Check whether session learnings (session-learnings__*.md in _dev/reports/analysis/) have been captured, and whether any recurring drift patterns should become command-hardening tasks or validation additions. When this cadence is hit, the explicit next step is /reconcile-lessons — do not attempt inline reconciliation within a review-progress pass.",
    "Once the master pipeline is complete, prefer active-workstreams reviews for bounded follow-on lanes instead of reusing advance-pipeline as a catch-all review target.",
    "When a plan is actually ready to execute, prefer execute-plan master over advance-pipeline unless the operator explicitly asked for the legacy alias.",
    "There is no separate progress-pipeline command. Use review-progress pipeline for a pipeline-oriented review, review-progress repo for overall repo state, and plan-active-workstreams when the master pipeline is already complete."
  ],
  "success_criteria": [
    "Review scope resolved from arguments or defaulted safely",
    "Source-of-truth docs read before judging completion",
    "Findings reported with file/path evidence when available",
    "Expectation-failure capture written even when empty",
    "User receives a concise findings-first assessment"
  ],
  "operator_guidance_phase_1": true,
  "operator_guidance_contract": {
    "rule": "This command must end with conditional next-step options (each with condition, command, why), plus a concrete request for operator input that would improve or harden the system."
  },
  "handoff": {
    "prompt_system_drift": "assemble-prompt-system all",
    "repo_coherent_not_queued": "plan-pipeline",
    "stage_ready_to_execute": "execute-plan master",
    "master_pipeline_complete_multiple_queues": "plan-active-workstreams",
    "lessons_reconciliation_cadence_hit": "reconcile-lessons",
    "pipeline_review_but_master_pipeline_complete": "review-progress repo or plan-active-workstreams"
  },
  "artifacts": [
    "_dev/reports/analysis/review-progress__<scope-safe>.md",
    "_dev/reports/analysis/review-progress__<scope-safe>.expectation-failures.json"
  ]
}
