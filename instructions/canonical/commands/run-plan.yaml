{
  "id": "run-plan",
  "description": "Resolve a plan-like artifact and route it to the correct execution pathway",
  "mode": "COORDINATOR",
  "objective": "Provide one operator-facing command that inspects a target plan artifact, determines whether it is an execution plan, task plan, or unsupported review artifact, and then routes it to the correct execution and review workflow truthfully.",
  "scope_resolution": {
    "default": "Resolve the argument as a plan id, task id, or path and inspect the artifact type before routing",
    "arguments": {
      "<plan-id>": "Try prompt-plan registry id first, then resolve task-plan via the shared resolver (tools/planning/lib/resolve-task-plan.js) which searches system root (_dev/reports/analysis/task-plans/) and all client roots (clients/*/plans/) with ambiguity blocking",
      "<task-id>": "Resolve task-plan via the shared resolver (tools/planning/lib/resolve-task-plan.js) — searches system root (_dev/reports/analysis/task-plans/) and all client roots (clients/*/plans/) with ambiguity blocking",
      "<path>": "Use the specified path directly and infer artifact type from file structure and contents"
    }
  },
  "distinct_review_gate": {
    "rule": "Pipeline rule (operator, 2026-06-10): plan -> codex distinct-mind review -> operator stamp -> (if BIG) /convene -> /run-plan. This is enforced MECHANICALLY by the UserPromptSubmit hook tools/kernel/hooks/userprompt-plan-review-gate.cjs, not by memory or instructions. The hook checks the plan's plan-task-review-state marker for a satisfying distinct_reviews[] entry ({actor, artifact, at, verdict}), with an artifact-glob fallback (_dev/reports/analysis/{review-progress__,codex-last-message__,codex-cli-run__}*<plan-id>*) for legacy plans. BIG = routing_expectations.risk_tier high OR marker.big=true (client-facing surface / new always-on infrastructure / multi-actor, recorded at review time); BIG plans additionally require convene evidence (marker.convene_review or _dev/reports/analysis/convene-runs/*<plan-id>*). When the gate injects a BLOCK, do not execute; produce the named missing artifact first (/dispatch-bridge for codex review, /convene for the triad). Operator-only override: `--skip-distinct-review` in the /run-plan prompt (logged to _dev/state/plan-review-gate/overrides.jsonl)."
  },
  "process": [
    "Resolve the target artifact from the argument. Prefer explicit paths when provided; otherwise check _dev/prompts/prompt-plan-registry.json ids first, then use the shared task-plan resolver (tools/planning/lib/resolve-task-plan.js) which searches system and client roots with ambiguity blocking.",
    "Inspect the resolver result for owned_artifacts_audit. If the audit is non-null and missing[] is non-empty, surface a STATE-RECONCILIATION WARNING block listing the missing paths BEFORE routing. The warning is informational, not blocking — the operator decides whether to investigate (likely a branch-state issue: cherry-pick from archive, re-run a prior slice, or amend the plan) or proceed. Audit fields: existing[] (paths present on disk), missing[] (paths absent from disk and not declared NEW by any step), planned_new[] (paths declared as files to be created by a step's files_touched (NEW) marker), glob_patterns_not_validated[] (paths containing glob characters; not checked).",
    "Inspect the artifact type before acting.",
    "If the artifact satisfies the prompt-plan contract from _dev/policies/plan-contract.md (ordered stages, observable exit criteria, prompt/workflow references where applicable, status surface), route to execute-plan.",
    "If the artifact is a task plan produced by /plan-task (task-intake schema JSON and matching markdown summary), do NOT pretend it is a prompt plan. Instead, execute it as a bounded task-implementation workflow: read the plan artifacts, honor gates and trust tier, use matched frameworks where applicable, implement the bounded task directly, verify the result, choose the correct post-execution review lane, and report remaining blockers truthfully.",
    "Before launching any write-capable or credential-dependent subagent during task-plan execution, run a preflight: prove the target write scope with a tiny disposable write, prove required credential paths are readable, and fail fast if either check fails.",
    "Do not source broad .env files inside subagents when a targeted secret extraction is sufficient. Extract only the exact variable needed and pass it via a temp file or explicit argument.",
    "For browser-authenticated work, prefer the proven authenticated session unless a fresh subagent session has explicitly demonstrated the same access.",
    "If the artifact is review-only, ambiguous, or missing the minimum structure needed for safe execution, stop and report why it cannot be run yet. Recommend the exact next command or conversion step.",
    "When routing to execute-plan, either invoke /execute-plan with the resolved plan id/path or clearly hand off to that exact command.",
    "When routing to task-plan execution, use the task plan as the source of truth for covered steps, gap steps, gates, and expected outcomes. Do not require the operator to restate the task.",
    "For task-plan execution: keep the work bounded to the scope expressed in the task plan, surface human gates before mutation steps, and verify completion against the task plan's expected outcomes and gates.",
    "After direct verification of a task-plan slice, route the slice into one of three closeout lanes: verify-local, codex-bridge, or operator gate.",
    "Honor an explicit task-plan review expectation when present, such as review_lane, trust tier, or equivalent closeout metadata, unless actual execution risk exceeded that expectation.",
    "Use verify-local only for low-risk, small, single-surface, repo-local slices with no credential dependency, no browser-auth dependency, no staging/production mutation, and no launch-critical or external-account impact. Record the verify-local JSON envelope as a durable analysis artifact. If verify-local exits with escalation or error, do not treat the slice as locally cleared; route it to codex-bridge or operator gate instead.",
    "Use codex-bridge for task-plan slices that are cross-surface, launch-critical, staging/production facing, browser-admin or credential dependent, external-account dependent, or otherwise above the local-first lane. Publish a truthful HandoffSignal/1.0, generate the codex bridge prompt artifact, and if the managed bridge runner is available dispatch it before reporting the slice complete.",
    "Use operator gate when the next step truly requires human judgment, human approval, missing credentials, or access that neither direct execution nor codex-bridge can resolve.",
    "Never collapse the distinction silently. Report both routes chosen: execution route and post-execution review route."
  ],
  "routing_rules": [
    "run-plan is the operator-facing router. execute-plan remains the strict executor for compatible prompt plans.",
    "Task plans are executable through run-plan, not through execute-plan directly unless they have first been converted into a plan-contract-compatible execution plan.",
    "Task-plan execution that uses write-capable subagents must pass the write-scope and credential-path preflight before deep work begins.",
    "run-plan must route not only by artifact type but also by post-execution review expectation: verify-local, codex-bridge, or operator gate.",
    "If task-plan metadata and actual execution risk disagree, trust actual execution risk and escalate the review lane accordingly.",
    "verify-local is a low-risk first-pass lane, not a blanket closeout path. Any escalation result from verify-local must route onward to codex-bridge or operator gate.",
    "When the required review lane is an actor bridge and the managed runner is available, run-plan must dispatch it automatically. handoff_prepared is not an acceptable resting state when dispatch capability exists.",
    "When both a prompt plan and a task plan appear to match the same id, prefer the explicit path. If the argument is ambiguous, list both candidates and ask for clarification rather than guessing.",
    "Never claim a task plan 'feeds into execute-plan' unless a real conversion step has produced a compatible prompt plan.",
    "If execution of a task-plan step reveals that plan assumptions, dependencies, outputs, gates, risk tier, or review lane have materially changed, stop execution and route to /amend-plan <task-id> before continuing. Do not silently adjust the plan in chat — amendment must be recorded durably.",
    "If task-plan execution depends on credentials, external accounts, or human approval gates, stop at that gate and report the exact missing prerequisite.",
    "Do not emit optional 'your call' next-step menus when the next step is mechanically determined and safe. Either dispatch automatically or stop in explicit blocked state with exact blocker, artifact, and retry path.",
    "Honor the distinct_review_gate: if the userprompt-plan-review-gate hook injected a BLOCK for this invocation, do not route to execution — surface the gate output verbatim and produce the missing distinct-review/convene artifact first (a producer cannot validate its own acceptance-grade outcome)."
  ],
  "success_criteria": [
    "Target artifact resolved before any execution",
    "Artifact type classified truthfully",
    "Correct route selected: execute-plan, task-plan execution, or blocked/unsupported",
    "Operator is not required to know the plan type in advance",
    "If execution occurs, verification evidence is produced for the bounded slice",
    "Write-capable subagent launches do not proceed without preflight proof of write access and credential-path readability",
    "Task-plan execution ends with an explicit post-execution review route and matching evidence artifacts",
    "Actor-bridge review lanes auto-dispatch when available or block truthfully when unavailable"
  ],
  "when_to_use": {
    "run-plan": "Primary operator execution router. Use when you have a plan artifact (task plan or prompt plan) and want to execute it without knowing the plan type.",
    "execute-plan": "Specialist prompt-plan executor with full orchestration (7-step pattern, codex bridge, lessons capture). Use only when you specifically need prompt-plan execution semantics.",
    "run-framework": "Direct framework execution. Use when you already know the framework and project and want to execute a framework's prompt chain directly, without a plan artifact."
  },
  "handoff": {
    "prompt_plan_detected": "execute-plan <resolved-plan>",
    "task_plan_detected": "run the bounded task-plan implementation workflow directly from the task plan artifacts, then route closeout to verify-local, codex-bridge, or operator gate",
    "unsupported_or_ambiguous": "review-task-plan, plan-task, or author a compatible execution plan depending on the blocker",
    "plan_diverged_during_execution": "/amend-plan <task-id> — when execution reality materially diverges from plan assumptions (changed dependencies, outputs, gates, risk tier, or review lane)"
  },
  "shared_resolver_requirement": {
    "rule": "All task-plan lookups must use resolveTaskPlanPaths() from tools/planning/lib/resolve-task-plan.js. Do not assume _dev-only storage. The resolver searches system root (_dev/reports/analysis/task-plans/) and all client roots (clients/*/plans/) with ambiguity blocking.",
    "exports_used": ["resolveTaskPlanPaths()", "resolveWriteRoot()", "listAllTaskPlans()", "listAmendments()", "classifyOwnedArtifacts()", "auditOwnedArtifacts()"]
  },
  "actor_bridge_completion_states": {
    "canonical_states": ["handoff_prepared", "bridge_active", "feedback_received", "blocked_on_actor_bridge"],
    "rule": "run-plan must use the same actor-bridge completion model as execute-plan. 'complete' is illegal before 'feedback_received'. Actor/model selection is router-driven, not worker-improvised. handoff_prepared is only valid as a transient state before dispatch or as a blocked truth state when dispatch capability is unavailable.",
    "state_definitions": {
      "handoff_prepared": "Live codex-targeted HandoffSignal/1.0 plus codex-bridge prompt artifact exist on disk.",
      "bridge_active": "Explicit evidence that the managed Codex listener or equivalent was launched and is still intended to be relied on.",
      "feedback_received": "A codex-authored follow-up signal plus codex-cli-run completion artifacts exist.",
      "blocked_on_actor_bridge": "The slice depends on an actor bridge that has not yet resolved — neither feedback_received nor a timeout/escalation has occurred."
    }
  },
  "post_run_controller": {
    "rule": "Task-plan execution must route through the shared post-run controller before declaring success. The controller enforces: debrief artifacts exist for meaningful runs, actor-bridge states are resolved (not left in handoff_prepared), and session learnings are captured."
  },
  "operator_guidance_phase_1": true,
  "operator_guidance_contract": {
    "rule": "This command must end with conditional next-step options (each with condition, command, why), plus a concrete request for operator input that would improve or harden the system."
  },
  "artifacts": [
    "_dev/prompts/prompt-plan-registry.json",
    "_dev/reports/analysis/task-plans/<task-id>__plan.json",
    "_dev/reports/analysis/task-plans/<task-id>__plan.md",
    "clients/<client-code>/plans/<task-id>__plan.json (when client-scoped)",
    "clients/<client-code>/plans/<task-id>__plan.md (when client-scoped)",
    "_dev/reports/analysis/verify-local__<scope-safe>.json (when task-plan closeout uses verify-local)",
    "_dev/reports/signals/*.json (when task-plan closeout uses codex-bridge)",
    "_dev/reports/analysis/codex-bridge-prompt__<scope-safe>.md (when task-plan closeout uses codex-bridge)",
    "_dev/reports/analysis/codex-listener-status.json (when managed auto-run is used)",
    "_dev/reports/analysis/advance-pipeline__<stage-id-safe>.md (when routed to execute-plan)",
    "_dev/reports/analysis/advance-pipeline__<stage-id-safe>.expectation-failures.json (when routed to execute-plan)"
  ]
}
