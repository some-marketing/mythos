    "Step 5 — Sync private remotes: run tools/hygiene/sync-private-remotes.sh from the repo root. Policy (operator decision 2026-06-10): GitHub origin is retired for the canonical branch; vps (ubuntu@149.56.14.10:git/SM_OS.git) and localmirror (/Volumes/file_storage/Backups/SM_OS-recovered.git) are the two redundancy legs. An absent/unreachable remote (drive unplugged, no network) is a WARN — continue and note in handoff. A push rejection exits 1 and halts the cascade — divergence requires human resolution; never force-push.",
