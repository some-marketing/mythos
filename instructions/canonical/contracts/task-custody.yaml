{
  "id": "task-custody",
  "version": "TaskCustody/1.0",
  "description": "Identity and custody contract for parallel Mythos task-plan workstreams.",
  "objective": "Keep every plan, amendment, repair, review, debrief, handoff, delegation, and scoped commit tied to the exact workstream it belongs to so parallel workflows do not bleed into one another.",
  "generator": "tools/planning/lib/task-custody.js",
  "mechanical_generation_rule": "scope_identity must be generated by buildScopeIdentity() or buildScopeIdentityForPlan() whenever the helper is available. Freehand authoring is allowed only as a blocked fallback and must record why the helper could not be used.",
  "scope_identity": {
    "workstream_scope": "task id, signal scope, plan id, or explicit workstream name",
    "session_or_run_id": "current session id, execution id, signal timestamp, or 'unknown:<reason>' when unavailable",
    "working_surface": "repo root plus client/project/framework/system surface",
    "custody_hierarchy": {
      "system_id": "repo/system identifier, normally Mythos",
      "client_code": "client code for client-owned work, or null for pure system work",
      "project_id": "project id/name under the client, or null when not project-scoped",
      "task_id": "task-plan id or concrete leaf task id",
      "parent_scope": "nearest parent custody scope such as client, project, prompt-plan, rollout, or null",
      "child_scopes": "array of child task ids, signals, subtasks, prompt-plan children, or generated follow-on scopes"
    },
    "owned_artifacts": "array of exact plan, amendment, repair, signal, review, debrief, handoff, and generated artifacts in scope",
    "forbidden_artifacts": "array of dirty or parallel-workflow surfaces that must not be touched"
  },
  "custody_chain_rule": [
    "A task plan establishes scope_identity.",
    "Scope identity is hierarchical. A task belongs to a project when project_id is present; a project belongs to a client when client_code is present; client and system scopes can own child task scopes. System work has system_id plus null client_code/project_id unless it is explicitly tied to an originating client.",
    "Every companion artifact copies or restates that scope_identity and adds its own artifact path to owned_artifacts when it becomes part of the same workstream.",
    "Downward propagation: child tasks, repair manifests, amendments, review signals, debriefs, handoffs, and delegated workers inherit the parent scope_identity and narrow owned_artifacts to their leaf scope.",
    "Upward propagation: project/client/system rollups may aggregate child status, but they must not claim ownership of child artifacts unless the child scope is explicitly listed in child_scopes or owned_artifacts.",
    "Every delegation prompt carries scope_identity, owned_artifacts, and forbidden_artifacts.",
    "Every review, debrief, next-session handoff, and scoped commit restates scope_identity before claiming closure.",
    "Global dirty worktree state is context, not ownership. It must not be staged, summarized as current-loop work, or used as completion evidence unless tied to the current workstream_scope."
  ],
  "ambiguity_rule": "If two live workflows share artifact prefixes, signal scopes, state markers, or candidate commit surfaces, stop in needs_context or run /normalize-signals before delegating, repairing, reviewing, or committing.",
  "authority_rule": "Base-plan scope_identity is an authority surface. Mutating it after plan creation routes through /repair-plan, not /amend-plan, because it changes task custody rather than future execution assumptions.",
  "commit_rule": "Scoped commits must include only owned_artifacts for the current workstream_scope plus explicitly justified cross-scope artifacts. Exclusions must be named before commit."
}
