{
  "id": "research/contractor-credential-review",
  "manifest_path": "frameworks/research/contractor-credential-review/manifest.json",
  "description": "Review publicly verifiable contractor credentials, licensing, insurance representations, and business reputation.",
  "inputs": ["subject.json", "jurisdiction.json", "search_context.md"],
  "outputs": ["outputs/contractor-credential-review/report.json", "outputs/contractor-credential-review/evidence-log.json"],
  "modes": ["FINDINGS_ONLY", "REVIEW_ONLY"],
  "operations": ["scope-intake", "credential-search", "risk-review"],
  "agent_profiles": ["scope-intake-agent", "credential-search-agent", "risk-review-agent"],
  "guardrail_overrides": ["Public records and published business claims only", "No accusation from a single source", "Do not contact or impersonate a subject"]
}
