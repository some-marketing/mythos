      "safety",
      "quality-process"
    ],
    "kinds": [
      "injection",
      "hard-gate",
      "review-routing"
    ],
    "modes": [
      "report-only",
      "blocking"
    ],
    "family_invariant": "Only quality-process adds may appear here. The SAFETY family (dangerous-cmd, arc-guard, credential, client-boundary, convene receipts) is tier-blind by construction and never expressed as a tier add (convene condition 5; structural lint lands in slice 2, step tier-s2a-safety-family-lint).",
