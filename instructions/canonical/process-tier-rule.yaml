  "stamp_provenance": {
    "description": "Every ProcessTierStamp records tier_provenance — HOW the tier was classified. An unresolvable model stamps fallback-scaffold with that provenance recorded, never a silent default. Additive field: readers must tolerate stamps without it (pre-slice-0 stamps degrade to null). A rejected upward declaration keeps the name-inferred provenance and records the rejection in the stamp's rejected_declaration field.",
    "values": [
      "resolved-model",
      "declared",
      "fallback-scaffold"
    ]
  },
  "declaration_policy": {
    "description": "Declarations are DOWN-ONLY (convene condition 3, slice-1 step tier-s1b-resolver-down-only). A session may declare a tier whose rank is equal to or lower than its name-inferred tier (equal-or-stricter). An UPWARD declaration is honored only when accompanied by an operator-provenance artifact reference that exists on disk; otherwise resolution falls back to the name-inferred tier and the rejected declaration is recorded in the stamp (rejected_declaration), never silently dropped.",
    "tier_rank": {
      "mechanical": 0,
      "sentinel": 1,
      "scaffold": 2,
      "associate": 3,
      "frontier": 4
    },
    "operator_provenance_sources": [
      "payload.process_tier_operator_provenance",
      "env MYTHOS_PROCESS_TIER_OPERATOR_PROVENANCE"
    ],
    "operator_provenance_requirement": "A repo-relative or absolute path to an operator-authored artifact (ratification record, stamped plan-review state, or operator decision artifact) that exists on disk at stamp time. The honored reference is recorded in the stamp as declaration_operator_provenance."
  },
  "coordination_scope": {
    "description": "Operator fork resolution 2026-06-11 (Ratification Record): the SUBTREE answer for haiku-as-coordinator, supersedes the triad's binary framing. The session/role context carries coordination_scope plus the subtree's declared judgment ceiling so the recursive invariant is checkable in hook code (consumers wired in slice 2, step tier-s2d).",
    "values": [
      "subtree",
      "session-root"
    ],
    "judgment_ceiling": "When coordination_scope is subtree, the context declares judgment_ceiling: the highest process tier of any judgment lane inside the subtree. The subtree coordinator's tier rank must be >= the judgment ceiling's rank.",
    "recursive_invariant": "coordinator tier >= highest judgment tier in subtree, applied recursively: every nested subtree coordinator must itself satisfy the invariant over its own subtree.",
    "subtree_contract_conditions": [
      "1. The subtree's desired state and acceptance criteria are pre-specified in artifact-verifiable form by a higher-tier mind.",
      "2. No judgment lane in the subtree exceeds the coordinator's tier (recursive invariant above).",
      "3. Acceptance is stamped up-lineage — the subtree coordinator reports evidence, never self-validates.",
      "4. Any off-script condition summons upward."
    ],
    "session_root_forbidden_for_models": [
      "claude-haiku-*",
      "haiku*"
    ],
    "acceptance_stamping_forbidden_for_models": [
      "claude-haiku-*",
      "haiku*"
    ]
  },
  "vocabulary_disambiguation": {
    "note": "Process-tier 'frontier' is a COORDINATOR operational-freedom class and names Opus-class models only (claude-opus-*, opus*) while Fable is retired (Fable globs removed 2026-06-15 pending deliberate re-evaluation of any successor). It is NOT dispatch-routing-rule's altitude-class 'frontier', which tiers DISPATCHED minds by work altitude and legitimately includes GPT-class minds (e.g. codex GPT-5.5) for distinct-intelligence reviews and frontier-altitude lanes. Placing gpt-5* in the associate COORDINATOR tier does not demote, restrict, or re-route reviewer/bridge lanes.",
    "cross_reference": "instructions/canonical/dispatch-routing-rule.yaml (vocabulary_disambiguation)",
    "reviewer_role_exemption": "Reviewer-role sessions are exempt from coordinator-tier restrictions. The no-final-status-authority and review-routing adds key on the session's coordinator role (coordination_scope/role context), never on model name (convene condition 8)."
  },
  "add_registry": {
    "description": "Strict enum of tier ADDS (convene condition 4, slice-1 step tier-s1a-rule-schema-1.1). Hooks consume add IDs resolved live from this registry via readSessionAdds() — never hardcoded tier names. Every add carries the full typed field set: family, kind, surfaces, paths, mode, artifact_query, bypass_policy. Unregistered add IDs are rejected by tools/maintenance/process-tier-rule-lint.cjs. Adds are productive scaffolding, not punishment: ceremony as exoskeleton.",
