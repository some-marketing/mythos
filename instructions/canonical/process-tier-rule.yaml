        "behavior": "Wire userprompt-owl-altitude.cjs globally but tier-gated: inject Observe -> Weigh -> Loop altitude framing only when the session carries this add; inert otherwise. (Consumer wired in slice 2, step tier-s2b-injection-consumers.)"
      },
      "mutation-plan-gate": {
        "family": "quality-process",
        "kind": "hard-gate",
        "surfaces": [
          "PreToolUse Edit|Write|mutating-Bash via tools/kernel/hooks/pretool-mutation-plan-gate.cjs (lands slice 2, step tier-s2c-mutation-plan-gate-report-only)"
        ],
        "paths": [
