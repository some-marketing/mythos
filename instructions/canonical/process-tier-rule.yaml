          "frameworks/**",
          "tools/kernel/**",
          ".claude/**",
          "_dev/state/session-tier/**",
          "_dev/reports/analysis/tier-track-record/**"
        ],
        "mode": "report-only",
        "artifact_query": "Approved task-plan/review artifact for the session's scope: _dev/reports/analysis/task-plans/<task>__plan.json plus an operator-stamped _dev/state/plan-task-review-state/<task>.json covering the governed path being mutated.",
        "bypass_policy": {
          "kill_switch": "_dev/state/kill-switches/mutation-plan-gate.off",
          "authority": "operator",
          "flip_to_blocking": "Separate operator decision gated on a reviewed report-only soak artifact (convene condition 6); never autonomous."
        },
        "behavior": "Detect mutations to governed paths (the perimeter INCLUDES the enforcement substrate per convene condition 7) and verify an approved plan/review artifact exists for the session's scope. Report-only until the operator flips it on soak evidence; block messages must name the exact missing artifact and remedy command."
      },
      "closeout-evidence-gate": {
        "family": "quality-process",
        "kind": "hard-gate",
        "surfaces": [
          "Stop via tools/kernel/hooks/stop-closeout-evidence-gate.cjs (lands slice 2, step tier-s2d-closeout-and-delegation-consumers)"
        ],
        "paths": [],
        "mode": "blocking",
        "artifact_query": "Changed-files record, test/smoke evidence, and — for acceptance-grade work — a distinct-review artifact, all present on disk before closeout.",
        "bypass_policy": {
          "kill_switch": "_dev/state/kill-switches/closeout-evidence-gate.off",
          "authority": "operator"
        },
        "behavior": "Refuse (blocking: trap the session at Stop until the evidence set is present; edits-gated so 0-edit read-only sessions pass, acceptance-grade adds the distinct-review requirement, operator kill-switch + fail-open-on-error preserved) closeout when the evidence set is missing. Promoted report-only -> blocking 2026-06-15 on soak evidence (operator ruling: no close without debrief)."
      },
