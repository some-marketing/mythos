  "invariants": [
    "Safety gates never tier down: destructive-action confirmation, credential rules, client-boundary rules, and convene receipts apply at every tier. The SAFETY family is tier-blind by construction and never expressed as a tier add.",
    "Tiering down ceremony does not tier down evidence: frontier coordinators still produce changed-files, tests, review artifacts, and debriefs per the Actor Continuity Contract.",
    "Coordinator tier must be greater than or equal to the highest judgment tier among the returns it must validate, unless validation is fully artifact-verifiable and script-owned. Applied recursively over coordination_scope subtrees: every subtree coordinator satisfies it over its own subtree.",
    "A sentinel can dispatch upward, but it cannot integrate or clear frontier-owned judgment work.",
    "Haiku-class minds may coordinate a bounded SUBTREE only under the four subtree_contract_conditions; session-root coordination and acceptance-stamping remain forbidden for haiku-class minds (operator fork resolution 2026-06-11).",
    "Unknown or unrecognized model strings default to scaffold, preserving today's discipline rather than silently suppressing process.",
    "Declarations are down-only: a declared tier may only select an equal-or-stricter (lower-rank) tier than name inference; an upward declaration requires an operator-provenance artifact reference, and rejected declarations are recorded in the stamp, never silently honored or dropped.",
    "Hooks consume add IDs resolved live from this rule via readSessionAdds(), never hardcoded tier names; unregistered add IDs are lint-rejected (tools/maintenance/process-tier-rule-lint.cjs).",
    "Process-tier 'frontier' (coordinator freedom, Opus-class while Fable retired) is distinct from dispatch-routing-rule's altitude-class 'frontier' (dispatched-mind altitude, includes GPT-class reviewers); coordinator re-mapping never demotes reviewer/bridge lanes.",
    "No claim of live enforcement may exceed the harness_capability column: a tier behavior is only 'enforced' on a harness whose medium is hook-enforced or tool-enforced with cited evidence."
  ],
