        "family": "quality-process",
        "kind": "hard-gate",
        "surfaces": [
          "PreToolUse Agent / dispatch tooling via tools/kernel/hooks/pretool-delegation-altitude.cjs (extended in slice 2, step tier-s2d-closeout-and-delegation-consumers)"
        ],
        "paths": [],
        "mode": "report-only",
        "artifact_query": "coordination_scope and declared judgment_ceiling in the session stamp; recursive invariant 'coordinator tier >= highest judgment tier in subtree' checkable via checkCoordinationInvariant (tools/kernel/hooks/lib/process-tier.cjs).",
        "bypass_policy": {
          "kill_switch": "_dev/state/kill-switches/delegation-altitude-cap.off",
          "authority": "operator"
        },
        "behavior": "Enforce rule invariant 3 in code at dispatch time: a coordinator may not dispatch-and-self-clear judgment work at or above its own tier; route acceptance validation upward or to script-verifiable checks. Subtree coordination obeys the coordination_scope contract."
      },
      "no-final-status-authority": {
        "family": "quality-process",
        "kind": "review-routing",
        "surfaces": [
          "HandoffSignal routing / dispatch tooling (slice 2, step tier-s2d-closeout-and-delegation-consumers)"
        ],
        "paths": [],
        "mode": "report-only",
        "artifact_query": "A frontier-coordinator or distinct-intelligence review artifact before final status on acceptance-grade work; for the associate tier this add applies to canonical/governance scope only.",
        "bypass_policy": {
          "kill_switch": "_dev/state/kill-switches/no-final-status-authority.off",
          "authority": "operator"
        },
        "behavior": "Final status on acceptance-grade work routes to a frontier coordinator or distinct-intelligence reviewer via HandoffSignal; the carrying coordinator proposes, never stamps. Keys on coordinator ROLE — reviewer-role sessions (e.g. gpt-5/opus distinct reviewers) are exempt (vocabulary_disambiguation.reviewer_role_exemption)."
      }
    }
  },
