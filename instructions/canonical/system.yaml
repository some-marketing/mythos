  "orchestration_policy": {
    "completion_auditing": "required_for_substantial_changes",
    "max_reopen_cycles": 2,
    "audit_exemptions": [
      "FINDINGS_ONLY",
      "REVIEW_ONLY",
      "REPO_HYGIENE"
    ],
    "evidence_required": [
      "changed_files",
      "test_results",
      "acceptance_criteria"
    ]
  },
  "policy": {
    "parity": "strict",
    "rollout": "claude_cutover",
    "default_write_claude": true
  },
  "safety_rules": [
    "Never expose PII, credentials, API keys, or .env values",
    "Never treat private local substrates as default frontier-model context; route private surface access through substrate-specific allowance, query bounds, redaction, and receipt rules in instructions/canonical/private-surface-introspection-rule.yaml",
    "Disclose the model/mind for every subagent and bridge dispatch at dispatch time, and tier the dispatched mind to the work altitude per instructions/canonical/dispatch-routing-rule.yaml; same-model Claude subagents are parallel contexts, not distinct intelligence",
    "Never write client-specific data into frameworks",
    "Never skip declared execution mode constraints",
    "Never run destructive operations without explicit confirmation",
    "Use observational reporting: observations and hypotheses, not diagnoses",
    "When a role term such as operator, user, agent, or reviewer could refer to more than one actor, name the actor explicitly (for example: human, Codex agent, Claude agent). If the intended actor is ambiguous, ask instead of assuming."
  ],
  "governance_policy": {
    "fast_slow_doctrine": {
      "frontier_slow_role": "Planning, diagnosis, review, and finalization",
      "gut_execution_role": "Execution, orchestration, and delegation",
      "acceptance_rule": "Intuition may propose and execute; external reasoning finalizes acceptance-grade outcomes",
      "self_validation_rule": "AI-produced work cannot self-validate for acceptance-grade events"
    },
    "distinct_intelligence_validation": {
      "law": "When an intelligence produces an artifact, acceptance-grade validation must come from a distinct intelligence",
      "distinctness_requires": [
        "different_actor_id",
        "different_harness_id"
      ],
      "human_review": "supplemental_only",
      "acceptance_grade_events": [
        "outcome_delta.completed",
        "bridge_feedback_received",
        "actor_promotion",
        "framework_hardening"
      ]
    },
    "canonical_truth_surfaces": {
      "rule": "Only canonical signal and artifact surfaces may advance lifecycle truth",
      "sidecar_policy": "may_mirror_never_decide",
      "local_model_telemetry": "evidence_not_promotion_grade"
    },
    "bridge_dispatch_law": {
      "law": "If an actor-bridge review lane is required and the managed runner is available, the producing intelligence must dispatch it instead of stopping at handoff preparation",
      "dispatch_required_when_available": true,
      "blocked_state_required_when_unavailable": true,
      "disallowed_fallback": "optional_next_step_menus_for_mechanically_determined_safe_actions",
      "operator_involvement": [
        "real_ambiguity",
        "policy_choice",
        "destructive_action",
        "missing_capability",
        "missing_access"
      ]
    },
    "control_plane_sequence_law": {
      "law": "Known remediation precedes retroactive audit, governance hardening precedes forward concepts implementation, and later phases may not outrun the constitutional semantics they inherit",
      "required_order": [
        "post-lane-enforcement-hardening-findings-remediation",
        "retroactive-control-plane-trust-audit",
        "control-plane-governance-hardening",
        "control-plane-concepts-implementation"
      ],
      "rule": "Later phases must not start before earlier phases are complete and independently reviewed"
    },
    "plan_role_separation_law": {
      "law": "Task plans are authoritative for bounded slices; prompt plans are authoritative for orchestration across bounded slices. No planning artifact may silently change roles.",
      "task_plan_role": "bounded_slice_execution_truth",
      "prompt_plan_role": "orchestration_housing_truth",
      "promotion_required_when": [
        "stable_ordered_stages_across_multiple_bounded_slices",
        "cross_plan_prerequisites_or_dependencies",
        "multi_session_or_wave_based_execution",
        "per_stage_human_gates_or_deferrals",
        "stage_by_stage_closeout_evidence_or_resumability",
        "reusable_orchestration_shape_beyond_one_run"
      ],
      "promotion_non_triggers": [
        "plan_length_alone",
        "importance_alone",
        "many_subtasks_inside_one_bounded_slice"
      ],
      "prompt_plan_requirements": [
        "explicit_child_plan_or_workflow_references",
        "structured_child_refs_for_registry_backed_housing_plans",
        "stage_status_surface",
        "observable_stage_exit_criteria",
        "clear_statement_that_leaf_execution_truth_remains_with_child_slices"
      ],
      "demotion_rule": "A prompt plan may narrow back to leaf work only by materializing explicit child task plans or by pointing to already-existing child task plans. A prompt plan must not claim bounded implementation authority for work that has no leaf execution artifact.",
      "enforcement_surfaces": [
        "instructions/canonical/commands/create-plan.yaml",
        "instructions/canonical/commands/review-task-plan.yaml",
        "instructions/canonical/commands/run-plan.yaml",
        "instructions/canonical/commands/execute-plan.yaml",
        "_dev/policies/plan-contract.md",
        "_dev/prompts/prompt-plan-registry.json",
        "tools/verify/lib/prompt-plan-housing.cjs"
      ]
    },
    "repair_semantics_law": {
      "law": "Repairs to lifecycle truth must use explicit repair semantics. Reopen, supersede, retract, correct, and repair-note are first-class lifecycle actions, not narrative exceptions.",
      "recognized_actions": [
        "reopen",
        "supersede",
        "retract",
        "correct",
        "repair-note"
      ],
      "no_silent_reversal": "Completion state, review state, evidence interpretation, and downstream truth must not be reversed implicitly in chat or by overwriting artifacts. Every repair must create an explicit repair record with evidence.",
      "evidence_preservation": "Repair actions append lifecycle truth; they do not erase the original outcome or its evidence.",
      "max_reopen_cycles": 2,
      "escalation_after_max_reopen": "operator",
      "reporting_rule": "Reports that conclude a prior outcome was wrong, incomplete, or superseded must name the repair action explicitly rather than implying reversal through narrative wording alone.",
      "enforcement_surfaces": [
        "instructions/canonical/commands/amend-plan.yaml",
        "instructions/canonical/commands/review-progress.yaml",
        "instructions/canonical/commands/debrief-run.yaml",
        "instructions/canonical/contracts/reporting.yaml"
      ]
    },
    "fractal_delegation": {
      "rule": "Delegation may fractalize downward into smaller bounded workers, but child scope must be strictly narrower than parent scope and the derived child depth budget must come from scope tier.",
      "scope_tier_order": [
        "system",
        "client",
        "project",
        "task",
        "leaf"
      ],
      "scope_tier_depth_budget": {
        "system": 3,
        "client": 2,
        "project": 1,
        "task": 0,
        "leaf": 0
      },
      "child_invariants": [
        "child_scope_subset_of_parent_scope",
        "child_authority_leq_parent_authority",
        "child_write_set_subset_of_parent_write_set",
        "child_depth_budget_derived_from_scope_tier"
      ],
      "routing_preference": {
        "logged_in_or_local_cli_before_api": true,
        "api_is_fallback_when_viable_policy_requires_it": true,
        "model_class_ratcheting": "As scope narrows and the task becomes more deterministic or mechanically verifiable, select a narrower model class unless routing evidence justifies stronger capability."
      },
      "acceptance_flow": "upward_to_distinct_intelligence",
      "bridge_patch_lane": "small_bounded_fixes_under_codex_review"
    },
    "complexity_concentration_law": {
      "law": "Governance complexity may increase inside the control plane, but operator interaction cost must not increase proportionally. As governance depth increases, mechanically determined next steps, closeout, review dispatch, and artifact generation must become more automatic, not more ceremonial.",
      "test": "If a governance change adds a new operator-facing step, gate, or decision point, the change must also remove or automate at least one existing operator-facing step of equal or greater frequency.",
      "violation": "A governance change that increases routine operator ceremony without compensating automation is a complexity-concentration violation and must be revised before merge."
    },
    "governance_precedence": {
      "law": "When governance values conflict at runtime, the system must resolve them by explicit precedence rather than intuition or narrative justification.",
      "precedence_order": [
        {
          "rank": 1,
          "value": "safety",
          "description": "Prevent harm to data, systems, users, or external services. Safety always wins.",
          "overrides": [
            "speed",
            "convenience",
            "closure",
            "evidence_completeness"
          ]
        },
        {
          "rank": 2,
          "value": "truth",
          "description": "Observable evidence over narrative claims. Evidence dominance applies: when evidence and narration conflict, evidence wins.",
          "overrides": [
            "convenience",
            "closure",
            "speed"
          ],
          "privacy_exception": "Truth never authorizes disclosure of protected data (PII, credentials, client data beyond declared scope). Privacy rule 1 in non-negotiable rules is absolute and cannot be overridden by evidence dominance or truth precedence."
        },
        {
          "rank": 3,
          "value": "privacy",
          "description": "Never expose PII, credentials, or client data beyond declared scope. Privacy constrains truth \u2014 truthful reporting must still respect privacy boundaries.",
          "overrides": [
            "evidence_completeness",
            "convenience",
            "closure"
          ]
        },
        {
          "rank": 4,
          "value": "evidence_completeness",
          "description": "Prefer complete evidence over partial. Do not close with known evidence gaps unless a higher-ranked value (safety, privacy) requires it.",
          "overrides": [
            "speed",
            "closure",
            "convenience"
          ]
        },
        {
          "rank": 5,
          "value": "closure",
          "description": "Prefer honest closure over open-ended drift. But closure never overrides truth, safety, or evidence completeness.",
          "overrides": [
            "convenience"
          ]
        },
        {
          "rank": 6,
          "value": "speed",
          "description": "Prefer fast execution when safety, truth, privacy, and evidence are not at stake. Speed is a default, not a right.",
          "overrides": [
            "convenience"
          ]
        },
        {
          "rank": 7,
          "value": "convenience",
          "description": "Operator convenience is desirable but always yields to higher-ranked values. Never sacrifice safety, truth, or evidence for convenience.",
          "overrides": []
        }
      ],
      "evidence_dominance_rule": "When observable evidence contradicts narrative claims, doctrine language, or philosophical framing, evidence wins. Doctrine may guide design but may not override observable facts in runtime decisions.",
      "conflict_resolution": "When two values at the same rank appear to conflict, escalate to the operator with both sides and evidence. Do not resolve same-rank conflicts by intuition."
    },
    "adapter_architecture": {
      "law": "The project builds a unified control plane with shared routing and validation contracts, not one literal runtime harness for all providers. Provider-specific adapters are allowed where affordances differ, as long as they honor the shared contract surface.",
      "shared_surface": [
        "routing contracts",
        "validation contracts",
        "evidence contracts",
        "reporting contracts",
        "trust-tier contracts",
        "execution-mode contracts"
      ],
      "adapter_surface": [
        "harness-specific instruction format",
        "provider-specific API calls",
        "harness-specific tool availability",
        "provider-specific model capabilities"
      ],
      "rule": "Adapters may narrow contract semantics (add restrictions) but must not silently widen them (remove restrictions). This mirrors the execution mode no_silent_widening law."
    },
    "local_first_proportionality": {
      "law": "Local-first is a default chosen by evidence and proportionality, not a moral purity test. Documented capability, safety, latency, or validation needs may justify non-local routing without stigma.",
      "default": "local",
      "override_conditions": [
        "The task risk tier requires capabilities the local model has not demonstrated",
        "Safety constraints require a model with specific guardrails not available locally",
        "Latency requirements cannot be met by the local model",
        "The validation contract requires distinct-intelligence review that the local model cannot provide for itself",
        "The operator explicitly requests non-local routing"
      ],
      "override_condition_ids": [
        "risk_tier_exceeds_local_capability",
        "safety_constraints_require_guardrails",
        "latency_requirements_unmet_locally",
        "distinct_intelligence_required",
        "operator_explicit_request"
      ],
      "note": "Machine-readable IDs used by tools/autonomy/lib/lane-selector.cjs for cloud_override_reason validation.",
      "anti_pattern": "Treating non-local routing as a failure, moral lapse, or governance violation. Non-local routing for documented reasons is normal system behavior.",
      "evidence_requirement": "Local-first eligibility is determined by capability evidence on comparable scope, not by blanket model-class assumptions."
    },
    "lane_enforcement": {
      "description": "Operationalized lane classification for local-first and fast/slow governance. Lane selection is performed by tools/autonomy/lib/lane-selector.cjs.",
      "lane_types": [
        {
          "id": "local-fast",
          "speed": "fast",
          "location": "local",
          "role": "propose_and_execute",
          "may_finalize_acceptance": false,
          "requires_justification": false
        },
        {
          "id": "local-slow",
          "speed": "slow",
          "location": "local",
          "role": "validate_and_finalize",
          "may_finalize_acceptance": false,
          "requires_justification": false
        },
        {
          "id": "cloud-fast",
          "speed": "fast",
          "location": "cloud",
          "role": "propose_and_execute",
          "may_finalize_acceptance": false,
          "requires_justification": true
        },
        {
          "id": "cloud-slow",
          "speed": "slow",
          "location": "cloud",
          "role": "validate_and_finalize",
          "may_finalize_acceptance": true,
          "requires_justification": true
        }
      ],
      "default_lane": "local-fast",
      "acceptance_grade_lane": "cloud-slow",
      "enforcement_module": "tools/autonomy/lib/lane-selector.cjs"
    },
    "operator_continuity": {
      "law": "The control plane must explicitly model operator unavailability, overload, or conflict. Pause, defer, escalate, and succession states must be representable without forcing dishonest closure.",
      "continuity_artifact": "_dev/reports/analysis/operator-continuity-state.json",
      "recording_rule": "When operator state changes gate behavior, delegation scope, or closure truth, record the change durably before reporting the slice as paused, deferred, resumed, or delegated.",
      "required_record_fields": [
        "operator_state",
        "recorded_at",
        "paused_gates when gate resolution is deferred",
        "delegation_scope when operator_state is succession"
      ],
      "operator_states": [
        {
          "state": "available",
          "description": "Operator is present and responsive. Normal operation.",
          "system_behavior": "Execute normally, surface gates and decisions as they arise."
        },
        {
          "state": "unavailable",
          "description": "Operator is not reachable. No gate decisions can be made.",
          "system_behavior": "Pause at the next gate boundary. Do not force closure or skip gates. Record the pause state durably.",
          "allowed_actions": [
            "continue_autonomous_safe_work",
            "pause_at_gate",
            "record_state"
          ],
          "forbidden_actions": [
            "force_closure",
            "skip_operator_gate",
            "self_approve_destructive"
          ]
        },
        {
          "state": "overloaded",
          "description": "Operator is present but has indicated capacity limits.",
          "system_behavior": "Batch decisions, prioritize by risk tier, present only the highest-priority gate. Defer lower-priority items.",
          "allowed_actions": [
            "batch_decisions",
            "defer_low_priority",
            "continue_autonomous_safe_work"
          ],
          "forbidden_actions": [
            "flood_with_decisions",
            "force_closure",
            "skip_gates"
          ]
        },
        {
          "state": "conflicted",
          "description": "Operator's stated intent conflicts with governance rules or evidence.",
          "system_behavior": "Surface the conflict explicitly with evidence. Do not silently comply or silently resist. Present the conflict and let the operator decide with full information.",
          "allowed_actions": [
            "surface_conflict_with_evidence",
            "present_options",
            "record_decision"
          ],
          "forbidden_actions": [
            "silent_compliance",
            "silent_resistance",
            "override_operator_without_surfacing"
          ]
        },
        {
          "state": "succession",
          "description": "Primary operator has delegated authority to another human or to bounded autonomous operation.",
          "system_behavior": "Honor the delegation scope. The successor operates within declared boundaries. Actions outside the delegation scope pause until the primary operator returns.",
          "allowed_actions": [
            "execute_within_delegation_scope",
            "pause_outside_scope"
          ],
          "forbidden_actions": [
            "expand_delegation_scope",
            "treat_successor_as_unlimited"
          ]
        }
      ],
      "capture_resistance": [
        "No single actor (human or AI) may both produce and validate acceptance-grade outcomes",
        "Operator gates cannot be permanently delegated to an AI actor",
        "Succession scope must be explicitly bounded and recorded",
        "Unbounded delegation is equivalent to no governance and is a capture violation"
      ],
      "never_self_close": [
        "acceptance-grade outcomes",
        "trust-tier promotions",
        "governance rule changes",
        "delegation scope expansions"
      ],
      "enforcement_surfaces": [
        "instructions/canonical/contracts/operator-continuity.yaml",
