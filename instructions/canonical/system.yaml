  "governance_definitions": {
    "description": "Machine-checkable definitions for core governance terms. A term that gates runtime behavior must have an entry here before it can be used in routing, closure, or validation contracts.",
    "terms": [
      {
        "id": "acceptance-grade",
        "definition": "An event whose outcome requires distinct-intelligence validation before finalization. The producing intelligence cannot self-finalize acceptance-grade events.",
        "machine_check": "Event type is listed in governance_policy.distinct_intelligence_validation.acceptance_grade_events AND outcome artifact includes validated_by_actor_id and validated_by_harness_id distinct from produced_by_actor_id and produced_by_harness_id."
      },
      {
        "id": "trusted",
        "definition": "An actor or artifact that has passed the trust-tier gating requirements declared for its scope. Trust is scoped, not global.",
        "machine_check": "Actor or artifact has a recorded trust-tier assignment in the relevant contract AND the assignment's evidence requirements are satisfied for that tier level."
      },
      {
        "id": "completion",
        "definition": "An outcome where outcome_delta.completed is true, supported by required evidence fields. For acceptance-grade events, distinct validation metadata is additionally required.",
        "machine_check": "outcome_delta.completed == true AND changed_files present AND acceptance_criteria cited AND scope_respected == true. For acceptance-grade: additionally validated_by_actor_id, validated_by_harness_id, validated_at, validation_artifact, and validation_method are present and validated_by_actor_id != produced_by_actor_id."
      },
      {
        "id": "operator",
        "definition": "The human actor who provides executive function, judgment, and approval at gate boundaries. The operator is never an agent or model.",
        "machine_check": "Actor metadata has actor_type == 'human' AND role == 'operator'. Agents and models cannot satisfy operator gates."
      },
      {
        "id": "slow-lane",
        "definition": "The review lane that routes through frontier/slow intelligence for planning, diagnosis, review, and finalization of acceptance-grade outcomes.",
        "machine_check": "Review lane assignment is 'codex-bridge' or equivalent distinct-intelligence lane AND the reviewing actor satisfies distinct_intelligence_validation.distinctness_requires."
      },
      {
        "id": "local-first-eligible",
        "definition": "A task or slice that can be routed to a local model when evidence demonstrates adequate capability, safety, latency, and validation characteristics for the declared scope. Local-first is an evidence-driven default, not a purity requirement.",
        "machine_check": "Task risk tier allows local routing AND no escalation_triggers are active AND capability evidence exists for the local model on comparable scope."
      },
      {
        "id": "repair",
        "definition": "A lifecycle action that reverses or corrects a prior outcome through explicit reversal semantics. Repair is a first-class lifecycle action, not a narrative exception.",
        "machine_check": "Action type is one of: reopen, supersede, retract, correct, repair-note. The action references the original outcome artifact by path and includes evidence for the correction."
      },
      {
        "id": "blocked",
        "definition": "A lifecycle state where the next step cannot proceed because a concrete, named blocker exists. Blocked is not a soft suggestion \u2014 it halts downstream progression.",
        "machine_check": "lifecycle_state == 'blocked' AND blocked_by array is non-empty AND each entry in blocked_by names a specific, verifiable condition."
      },
      {
        "id": "independently-reviewed",
        "definition": "An outcome whose canonical outcome artifact records completion plus distinct validator metadata. Narrative mentions of review without these fields do not satisfy the independently-reviewed gate.",
        "machine_check": "outcome_delta.completed == true AND validated_by_actor_id != produced_by_actor_id AND validated_by_harness_id != produced_by_harness_id AND validated_at is a valid ISO-8601 timestamp AND validation_artifact is a valid file path that exists AND validation_method is a non-empty string describing the validation approach."
      },
      {
        "id": "recursive-delegation-scope-tier",
        "definition": "A delegation whose child depth budget is derived from a scope tier token and whose child scope must be narrower than its parent scope.",
        "machine_check": "Delegation scope tier is known, child depth budget equals the tier budget, child scope is a strict subset of parent scope, and child authority/write set do not exceed the parent."
      },
      {
        "id": "logged-in-first-bridge-routing",
        "definition": "When a bridge target has both a logged-in/local CLI lane and an API lane, the logged-in/local CLI lane is preferred whenever it can honestly cover the task.",
        "machine_check": "Bridge target policy exposes a logged-in/local CLI transport, the invocation resolves it by default when viable, and API is used only when the routing policy says it is allowed or required."
      },
      {
        "id": "bridge-model-freshness",
        "definition": "Bridge model selection must reject stale known model ids before dispatch and must surface the docs freshness used for that decision.",
        "machine_check": "validateBridgeTargetModel rejects stale ids, resolveBridgeInvocation includes docs freshness metadata, and the invocation records the model source checked_at value."
      }
    ]
  },
