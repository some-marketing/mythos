      "id": "RUN_ONLY",
      "can_write": "reports_only",
      "can_execute": true,
      "description": "Execute runs without applying fixes"
    },
    {
      "id": "REVIEW_ONLY",
      "can_write": "analysis_only",
      "can_execute": false,
      "description": "Analyze existing outputs"
    },
    {
      "id": "PATCH_ALLOWED",
      "can_write": "scoped",
      "can_execute": true,
